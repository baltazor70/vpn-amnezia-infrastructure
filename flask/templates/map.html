<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>VPN GeoMap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;overflow:hidden}
#map{position:absolute;top:0;left:0;width:100%;height:100%}
.nav-btns{position:fixed;top:20px;right:20px;z-index:9999;display:flex;gap:10px}
.btn{background:#1e293b;border:1px solid #3b82f6;color:#fff;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:bold}
.btn:hover{background:#3b82f6}
.sidebar{position:fixed;top:20px;left:20px;width:220px;bottom:60px;background:rgba(15,23,42,0.9);border:1px solid #334155;border-radius:8px;z-index:9998;overflow-y:auto;padding:10px}
.item{padding:8px;margin-bottom:5px;background:#1e293b;border-radius:5px;cursor:pointer;font-size:12px}
.item:hover{background:#3b82f6}
.stats{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9998;background:rgba(15,23,42,0.9);padding:10px 20px;border-radius:8px;border:1px solid #334155;display:flex;gap:15px}

/* ✅ ПРОСТЫЕ ЗЕЛЕНЫЕ МАРКЕРЫ (без сдвигов) */
.green-dot {
    background: #22c55e;
    border-radius: 50%;
    border: 2px solid #fff;
    width: 10px;
    height: 10px;
    box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.leaflet-popup-content-wrapper{background:#0f172a;color:#fff;border:1px solid #3b82f6;border-radius:8px}
.leaflet-popup-tip{background:#0f172a}
</style>
</head>
<body>
<div id="map"></div>
<div class="nav-btns">
  <button class="btn" onclick="window.location.href='/'">← Панель</button>
  <button class="btn" onclick="loadData()">🔄 Обновить</button>
</div>
<div class="sidebar" id="list"><div style="text-align:center;padding:10px;color:#64748b">Загрузка...</div></div>
<div class="stats">
  <span>Онлайн: <b id="s-act" style="color:#3b82f6">0</b></span>
  <span>Гео: <b id="s-geo" style="color:#3b82f6">0</b></span>
  <span>Трафик: <b id="s-trf" style="color:#3b82f6">0</b> GB</span>
</div>
<script>
const map = L.map('map', {zoomControl: false}).setView([55.75, 37.61], 5);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16}).addTo(map);
let markers = {};

async function loadData() {
  try {
    const res = await fetch('/api/load_map?t=' + Date.now());
    if (res.status === 401) return window.location.href = '/';
    const data = await res.json();
    
    document.getElementById('s-act').innerText = data.active;
    document.getElementById('s-geo').innerText = data.fetched_geo;
    document.getElementById('s-trf').innerText = data.total_gb;

    Object.values(markers).forEach(m => map.removeLayer(m.marker));
    markers = {};
    document.getElementById('list').innerHTML = '';

    let count = 0;
    // Рисуем маркеры строго по координатам, без смещений
    data.peers.forEach((p, i) => {
      if (p.geo && typeof p.geo.lat === 'number') {
        // Стандартный div-маркер
        const icon = L.divIcon({ className: 'green-dot', iconSize: [14, 14], iconAnchor: [7, 7] });
        const m = L.marker([p.geo.lat, p.geo.lon], { icon: icon }).addTo(map);
        m.bindPopup('<b style="color:#22c55e">' + p.display_name + '</b><br>' + p.geo.city + '<br>' + p.ext_ip);
        markers[i] = { marker: m, lat: p.geo.lat, lon: p.geo.lon };

        const el = document.createElement('div');
        el.className = 'item';
        el.innerText = '👤 ' + p.display_name + ' (' + p.geo.city + ')';
        el.onclick = () => {
          map.flyTo([p.geo.lat, p.geo.lon], 10);
          m.openPopup();
        };
        document.getElementById('list').appendChild(el);
        count++;
      }
    });
    console.log('Отрисовано маркеров:', count);
  } catch (e) { console.error(e); }
}
loadData();
</script>
</body>
</html>
